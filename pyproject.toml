[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-pinns-failure-analysis"
version = "0.1.0"
description = "PINN failure-mode research with independent numerical references"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
pinn = ["deepxde>=1.12,<2", "torch>=2.2"]
